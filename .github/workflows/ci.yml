name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests & Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stok_gudang_test
          POSTGRES_USER: stoqa_user
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, bcmath, zip
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js & Build Assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Check Code Style (Pint)
        run: php vendor/bin/pint --test

      - name: Static Analysis (Larastan)
        run: php vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Run Tests (PostgreSQL CI)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: stok_gudang_test
          DB_USERNAME: stoqa_user
          DB_PASSWORD: secret_password
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: 5432
          DB_TEST_DATABASE: stok_gudang_test
          DB_TEST_USERNAME: stoqa_user
          DB_TEST_PASSWORD: secret_password
        run: |
          php artisan migrate --force
          php vendor/bin/pest
